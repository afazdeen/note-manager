# Runs the whole app: docker compose up --build
#   Web app:  http://localhost:3000
#   API:      http://localhost:8080/api
#   MCP:      http://localhost:8080/mcp
#
# Change the host ports with WEB_PORT and API_PORT (e.g. WEB_PORT=4000 docker compose up --build).
# The browser calls the API directly, so the web build and the API's CORS setting
# are both derived from these ports.

name: team-notes

services:
  api:
    build: ./api
    image: team-notes-api
    environment:
      CORS_ALLOWED_ORIGIN: http://localhost:${WEB_PORT:-3000}
      SEED_NOTES: "true"
    ports:
      # 127.0.0.1 only: there is no authentication, so don't expose it to the network.
      - "127.0.0.1:${API_PORT:-8080}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: http://localhost:${API_PORT:-8080}/api
    image: team-notes-web
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:8080"
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /tmp # nginx writes its pid and temp files here
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
